apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.x
      helm:
        values: |
          nameOverride: prometheus

          alertmanager:
            enabled: true
            alertmanagerSpec:
              retention: 120h
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 2Gi
            # No ingress: Alertmanager is reachable in-cluster and through
            # Grafana. Exposing it publicly would add a route that can silence
            # alerts, which is not something to put behind one auth hop.
            #
            # Notifications currently go nowhere. To deliver them, create a
            # Secret holding alertmanager.yaml with a real receiver and set
            # alertmanagerSpec.configSecret to its name -- the same pattern
            # used for grafana-admin-credentials above.

          # k3s runs the controller manager, scheduler, etcd and kube-proxy
          # inside the server process rather than as separately scraped
          # components. Their Services exist but resolve to no endpoints, so
          # the bundled KubeControllerManagerDown, KubeSchedulerDown,
          # etcdMembersDown and KubeProxyDown rules fire permanently and
          # falsely. This was invisible while Alertmanager was disabled.
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeEtcd:
            enabled: false
          kubeProxy:
            enabled: false

          grafana:
            enabled: true
            admin:
              existingSecret: grafana-admin-credentials
              userKey: admin-user
              passwordKey: admin-password
            deploymentStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            grafana.ini:
              server:
                root_url: https://grafana.agffa.ca
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
                traefik.ingress.kubernetes.io/router.middlewares: traefik-authentik-forwardauth@kubernetescrd
                cert-manager.io/cluster-issuer: letsencrypt-production
              hosts:
                - grafana.agffa.ca
              tls:
                - secretName: grafana-tls
                  hosts:
                    - grafana.agffa.ca
            persistence:
              enabled: true
              storageClassName: longhorn
              size: 5Gi
            sidecar:
              dashboards:
                enabled: true
                searchNamespace: ALL


          prometheus:
            prometheusSpec:
              retention: 15d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 20Gi
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false

          nodeExporter:
            enabled: true

          kubeStateMetrics:
            enabled: true

    - repoURL: https://github.com/ItsRyanG/homelab-infra.git
      targetRevision: main
      path: monitoring/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
