apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          args:
            # --insecure: TLS is terminated at Traefik; the server speaks plain
            # HTTP behind the ingress. Authentication stays enabled.
            - /usr/local/bin/argocd-server
            - --insecure
