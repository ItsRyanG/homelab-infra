apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://crowdsecurity.github.io/helm-charts
    chart: crowdsec
    targetRevision: 0.x
    helm:
      values: |
        container_runtime: containerd

        agent:
          acquisition:
            - namespace: traefik
              podName: traefik-helm-*
              program: traefik
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/linux"

        lapi:
          env:
            - name: ENROLL_KEY
              value: ""
            - name: ENROLL_INSTANCE_NAME
              value: "k8s-lab"

          persistentVolume:
            data:
              enabled: true
              storageClassName: longhorn
              size: 5Gi
            config:
              enabled: true
              storageClassName: longhorn
              size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
