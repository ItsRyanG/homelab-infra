    tunnel: 4a45edc2-492c-4e56-9214-6c114a5e2227
    no-autoupdate: true
    originRequest:
      noTLSVerify: true
    ingress:
      - hostname: sonarr.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: radarr.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: nzbget.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: plex.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: home.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: grafana.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: portainer.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - hostname: authentik.agffa.ca
        service: https://traefik-helm.traefik.svc.cluster.local:443
      - service: http_status:404
