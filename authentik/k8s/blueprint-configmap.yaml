apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  traefik-forwardauth.yaml: |
    version: 1
    metadata:
      name: traefik-forwardauth
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: traefik-forwardauth
        attrs:
          name: traefik-forwardauth
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          mode: forward_domain
          external_host: https://authentik.agffa.ca
          cookie_domain: agffa.ca
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: traefik-forwardauth
        attrs:
          name: Traefik ForwardAuth
          slug: traefik-forwardauth
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, traefik-forwardauth]]

      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, traefik-forwardauth]]

  portainer-oauth.yaml: |
    version: 1
    metadata:
      name: portainer-oauth
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: portainer
        attrs:
          name: portainer
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: portainer
          redirect_uris: "https://portainer.agffa.ca/"
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: portainer
        attrs:
          name: Portainer
          slug: portainer
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, portainer]]
