apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app: homepage
data:
  settings.yaml: |
    title: Lab Dashboard
    theme: dark
    color: slate
    headerStyle: clean
    allowInsecureConnections: true
    layout:
      Media:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3

  widgets.yaml: |
    - greeting:
        text_size: 3xl
        text: agffa.ca homelab
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  services.yaml: |
    - Media:
        - Plex:
            href: https://plex.agffa.ca
            description: Media Server
            icon: plex.png
            namespace: plex
            app: plex
            widget:
              type: plex
              url: http://plex-service.plex.svc.cluster.local:32400
              key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
        - Sonarr:
            href: https://sonarr.agffa.ca
            description: TV Shows
            icon: sonarr.png
            namespace: sonarr
            app: sonarr
            widget:
              type: sonarr
              url: http://sonarr-service.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
              enableQueue: true
        - Radarr:
            href: https://radarr.agffa.ca
            description: Movies
            icon: radarr.png
            namespace: radarr
            app: radarr
            widget:
              type: radarr
              url: http://radarr-service.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
              enableQueue: true
        - NZBGet:
            href: https://nzbget.agffa.ca
            description: Usenet Downloader
            icon: nzbget.png
            namespace: nzbget
            app: nzbget
            widget:
              type: nzbget
              url: http://nzbget-service.nzbget.svc.cluster.local:6789

    - Infrastructure:
        - ArgoCD:
            href: https://argocd.agffa.ca
            description: GitOps
            icon: argocd.png
            namespace: argocd
            app: argocd-server
        - Longhorn:
            href: https://longhorn.agffa.ca
            description: Block Storage
            icon: longhorn.png
            namespace: longhorn-system
            app: longhorn-manager
            podSelector: app=longhorn-manager
            widget:
              type: longhorn
              url: http://longhorn-frontend.longhorn-system.svc.cluster.local
        - Portainer:
            href: https://portainer.agffa.ca
            description: Cluster Management
            icon: portainer.png
            namespace: portainer
            app: portainer
        - Traefik:
            href: https://traefik.agffa.ca
            description: Reverse Proxy
            icon: traefik.png
            namespace: traefik
            app: traefik
            widget:
              type: traefik
              url: http://traefik-dashboard.traefik.svc.cluster.local:8080
        - Unraid:
            href: http://192.168.2.100
            description: NAS
            icon: unraid.png
            widget:
              type: unraid
              url: http://192.168.2.100
              key: "{{HOMEPAGE_VAR_UNRAID_API_KEY}}"
        - Unifi:
            href: https://192.168.2.1
            description: Network
            icon: unifi.png
            widget:
              type: unifi
              url: https://192.168.2.1
              username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}"
              password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
              site: default

    - Monitoring:
        - Grafana:
            href: https://grafana.agffa.ca
            description: Metrics & Dashboards
            icon: grafana.png
            namespace: monitoring
            app: grafana
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: homepage
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            href: https://prometheus.agffa.ca
            description: Metrics
            icon: prometheus.png
            namespace: monitoring
            app: prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - CrowdSec:
            href: https://app.crowdsec.net
            description: Security Engine
            icon: crowdsec.png

  bookmarks.yaml: |
    - Quick Links:
        - GitHub:
            - href: https://github.com/ItsRyanG
              icon: github.png
        - Cloudflare:
            - href: https://dash.cloudflare.com
              icon: cloudflare.png
        - Unraid:
            - href: http://192.168.2.100
              icon: unraid.png

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""
