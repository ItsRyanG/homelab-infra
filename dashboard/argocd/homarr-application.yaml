apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://oben01.github.io/charts
    chart: homarr
    targetRevision: 0.x
    helm:
      values: |
        image:
          repository: ghcr.io/ajnart/homarr
          tag: latest

        persistence:
          configs:
            enabled: true
            storageClass: longhorn
            size: 1Gi
          data:
            enabled: true
            storageClass: longhorn
            size: 1Gi
          icons:
            enabled: true
            storageClass: longhorn
            size: 1Gi

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          hosts:
            - host: home.lab.agffa.ca
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: agffa-tls
              hosts:
                - home.lab.agffa.ca
  destination:
    server: https://kubernetes.default.svc
    namespace: homarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
