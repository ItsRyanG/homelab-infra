apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    ---
    log:
      level: info

    authentication_backend:
      file:
        path: /secrets/users_database.yml
        password:
          algorithm: argon2id
          iterations: 3
          memory: 65536
          parallelism: 4

    session:
      name: authelia_session
      expiration: 12h
      inactivity: 45m
      remember_me: 1M
      cookies:
        - domain: agffa.ca
          authelia_url: https://authelia.agffa.ca
          default_redirection_url: https://home.agffa.ca

    storage:
      local:
        path: /config/db.sqlite3

    access_control:
      default_policy: one_factor

    notifier:
      filesystem:
        filename: /config/notification.txt

    # identity_providers is deliberately absent from this ConfigMap.
    #
    # OIDC client entries carry a client_secret hash, and this repository is
    # public. The whole block lives in the authelia-secret Secret instead,
    # under secrets.yml, which the Deployment passes as a second --config
    # file. Authelia merges the two at startup.
