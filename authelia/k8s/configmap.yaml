apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    ---
    log:
      level: info

    authentication_backend:
      file:
        path: /secrets/users_database.yml
        password:
          algorithm: argon2id
          iterations: 3
          memory: 65536
          parallelism: 4

    session:
      name: authelia_session
      expiration: 12h
      inactivity: 45m
      remember_me: 1M
      cookies:
        - domain: agffa.ca
          authelia_url: https://authelia.agffa.ca
          default_redirection_url: https://home.agffa.ca

    storage:
      local:
        path: /config/db.sqlite3

    access_control:
      default_policy: one_factor

    notifier:
      filesystem:
        filename: /config/notification.txt

    identity_providers:
      oidc:
        cors:
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
        clients:
          - client_id: portainer
            client_name: Portainer
            client_secret: '$2b$12$HVHWj/P0gaNMSSTpWa8iNeLIr9wMYttKv47PPfBE15WrCPUbkvoGe'
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://portainer.agffa.ca/
            scopes:
              - openid
              - profile
              - email
              - groups
            userinfo_signed_response_alg: none
