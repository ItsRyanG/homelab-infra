apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: authelia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/target: "4a45edc2-492c-4e56-9214-6c114a5e2227.cfargotunnel.com"
spec:
  ingressClassName: traefik
  tls:
    - secretName: authelia-tls
      hosts:
        - authelia.agffa.ca
  rules:
    - host: authelia.agffa.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 9091
