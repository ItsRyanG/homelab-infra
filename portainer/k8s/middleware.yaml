apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ip-allowlist-home
  namespace: portainer
spec:
  ipAllowList:
    # Placeholder only. The real value is the current WAN address, written at
    # runtime by the ip-monitor CronJob and excluded from ArgoCD diffing via
    # ignoreDifferences on the portainer Application. Do not commit a real
    # address here: this repository is public, and the value changes anyway.
    # 192.0.2.0/24 is RFC 5737 TEST-NET-1 and routes nowhere.
    sourceRange:
      - "192.0.2.1/32"
    ipStrategy:
      excludedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "10.42.0.0/16"
