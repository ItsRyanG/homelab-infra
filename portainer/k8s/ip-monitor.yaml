apiVersion: v1
kind: ServiceAccount
metadata:
  name: ip-monitor
  namespace: portainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ip-monitor
  namespace: portainer
rules:
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    resourceNames: ["ip-allowlist-home"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ip-monitor
  namespace: portainer
subjects:
  - kind: ServiceAccount
    name: ip-monitor
    namespace: portainer
roleRef:
  kind: Role
  name: ip-monitor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ip-monitor
  namespace: portainer
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ip-monitor
          restartPolicy: OnFailure
          containers:
            - name: ip-monitor
              # alpine/k8s bundles kubectl with a shell and curl. The previous
              # bitnami/kubectl image shipped neither wget nor curl, so the
              # lookup below silently produced an empty string.
              image: alpine/k8s:1.31.13
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  CURRENT_IP=$(curl -fsS --max-time 10 https://api.ipify.org || true)

                  # Never patch on a failed lookup. Without this guard an empty
                  # result writes "/32" into sourceRange, which is not a valid
                  # CIDR and silently breaks the middleware.
                  if ! echo "$CURRENT_IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                    echo "Could not determine WAN IP (got: '${CURRENT_IP}'). Allowlist left unchanged."
                    exit 0
                  fi

                  EXISTING=$(kubectl get middleware ip-allowlist-home -n portainer \
                    -o jsonpath='{.spec.ipAllowList.sourceRange[0]}' | cut -d/ -f1)

                  if [ "$CURRENT_IP" = "$EXISTING" ]; then
                    echo "WAN IP unchanged: $CURRENT_IP"
                    exit 0
                  fi

                  echo "WAN IP changed: ${EXISTING:-<unset>} -> ${CURRENT_IP}. Updating allowlist."
                  kubectl patch middleware ip-allowlist-home -n portainer --type='json' \
                    -p="[{\"op\":\"replace\",\"path\":\"/spec/ipAllowList/sourceRange/0\",\"value\":\"${CURRENT_IP}/32\"}]"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
